<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JPG to PDF Converter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; text-align: center; }
        h1 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>JPG to PDF Converter</h1>
    <p>Pilih beberapa gambar untuk digabung jadi satu PDF.</p>
    <form action="/convert" method="post" enctype="multipart/form-data">
        <input type="file" name="images" accept="image/jpeg,image/jpg" multiple required><br>
        <button type="submit">Convert ke PDF</button>
    </form>
</body>
</html>
